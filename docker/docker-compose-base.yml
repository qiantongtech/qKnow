services:
  redis:
    image: redis:6-alpine
    profiles: ["all","base"]
    env_file: .env
    restart: always
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD:-tF0cC3aE2tD2hK0dA0oT}
#    volumes:
#      # Mount the redis data directory to the container.
#      - ./redis/data:/data
    # Set the redis password when startup redis server.
    command: redis-server --requirepass ${REDIS_PASSWORD:-tF0cC3aE2tD2hK0dA0oT}
    ports:
      - "${EXPOSE_REDIS_PORT:-6379}:6379"
    healthcheck:
      test: [ 'CMD', 'redis-cli', '-a', '${REDIS_PASSWORD:-tF0cC3aE2tD2hK0dA0oT}', 'ping' ]
    networks:
      - qknownet
    extra_hosts:
      - "host.docker.internal:host-gateway"

  neo4j:
    image: neo4j:4.4.40
    profiles: ["all","base"]
    restart: always
    environment:
      - NEO4J_AUTH=neo4j/${NEO4J_PASSWORD:-aA3nJ7pF1iJ2cB0fM1nJ}
    ports:
      - "47474:7474"
      - "47687:7687"
    volumes:
      - ./qKnow/neo4j/data:/data
      - ./qKnow/neo4j/logs:/logs
      - ./qKnow/neo4j/conf:/var/lib/neo4j/conf
    healthcheck:
      test: [ "CMD", "cypher-shell", "-u", "neo4j", "-p", "${NEO4J_PASSWORD:-aA3nJ7pF1iJ2cB0fM1nJ}", "RETURN 1;" ]
      interval: 30s      # 每 30 秒检查一次
      timeout: 10s       # 超过 10 秒算失败
      retries: 5         # 连续失败 5 次算 unhealthy
      start_period: 120s  # 容器启动后等待 120 秒再开始检测
    networks:
      - qknownet
    extra_hosts:
      - "host.docker.internal:host-gateway"

  nginx:
    image: nginx:1.24.0
    restart: always
    profiles: ["all","base"]
    env_file: .env
    ports:
      - '${EXPOSE_NGINX_PORT:-80}:${NGINX_PORT:-80}'
    networks:
      - qknownet
    volumes:
      - ./qKnow/nginx/dist:/usr/share/nginx
      - ./qKnow/nginx/logs:/var/log/nginx
      - ./qKnow/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./qKnow/nginx/sites/:/etc/nginx/http_vhost/:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"

  #MySQL主库
  mysql57:
    image: mysql:5.7
    profiles: ["all","base"]
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD:  ${MYSQL_ROOT_PASSWORD:-lJ7gP0cA5dD2dA1hA3bJ}   # ← 修改成你的
      TZ: "Asia/Shanghai"                          # 如需改时区请改
    ports:
      - "23306:3306"
    volumes:
      - ./qKnow/db/conf.d/my.cnf:/etc/mysql/conf.d/my.cnf:ro
      - ./qKnow/db/init:/docker-entrypoint-initdb.d:ro
    networks:
      - qknownet
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-plJ7gP0cA5dD2dA1hA3bJ" ]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 300s
    extra_hosts:
      - "host.docker.internal:host-gateway"

  weaviate:
    image: semitechnologies/weaviate:1.32.23
    profiles: ["all","base"]
    restart: always
    hostname: weaviate
    ports:
      - "28080:8080"
      - "60051:50051"
    volumes:
      - ./qKnow/weaviate:/var/lib/weaviate
    environment:
      PERSISTENCE_DATA_PATH: /var/lib/weaviate
      QUERY_DEFAULTS_LIMIT: 25
      CLUSTER_ENABLED: "false"
      AUTHENTICATION_ANONYMOUS_ACCESS_ENABLED: false
      DEFAULT_VECTORIZER_MODULE: none
      AUTHENTICATION_APIKEY_ENABLED: true
      AUTHENTICATION_APIKEY_ALLOWED_KEYS: WVF5YThaHlkYwhGUSmCRgsX3tD5ngdN8pkih
      AUTHENTICATION_APIKEY_USERS: hello@qknow
      AUTHORIZATION_ADMINLIST_ENABLED: true
      AUTHORIZATION_ADMINLIST_USERS: hello@qknow
    healthcheck:
      # 健康检查，确保服务正常启动
      test: [ "CMD", "wget", "--no-verbose", "--tries=1", "--spider","--header", "Authorization:Bearer WVF5YThaHlkYwhGUSmCRgsX3tD5ngdN8pkih", "http://localhost:8080/v1/meta" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - qknownet
    extra_hosts:
      - "host.docker.internal:host-gateway"
